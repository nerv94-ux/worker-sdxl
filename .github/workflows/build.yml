name: Build & push image

# Upstream only built on GitHub *releases* and used `runs-on: DO`, a RunPod-internal
# runner that doesn't exist for forks. This builds on every push to main instead, so
# a code change is one commit away from a deployable image.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is large (CUDA runtime + torch + baked SDXL weights). The default
      # runner disk fills up during build without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          # Two tags: a moving `latest` and an immutable one pinned to the commit.
          # RunPod endpoints should point at the sha tag so a redeploy is explicit
          # rather than "whatever latest happens to be right now".
          tags: |
            ${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:latest
            ${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image
        run: echo "pushed ${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:${{ github.sha }}"
